{% load static %}
<div class="row">
    <label class="form-label"> Selecciona la tarjeta </label>
    {% for group, options, index in widget.optgroups %}
        {% for option in options %}
            <div class="col-lg-4">
                <label for="{{ option.attrs.id }}" class="card-radio-label">
                    <input type="radio" id="{{ option.attrs.id }}" name="{{ widget.name }}" value="{{ option.value }}" style="display:none;" {% if option.selected %}checked{% endif %}>
                    {% if option.value == '01' %}
                        <img src="{% static 'img/metodo_pago/visa.jpg' %}" alt="VISA" class="card-radio-image">
                    {% elif option.value == '02' %}
                        <img src="{% static 'img/metodo_pago/mastercard.webp' %}" alt="MASTERCARD" class="card-radio-image">
                    {% elif option.value == '03' %}
                        <img src="{% static 'img/metodo_pago/american_express.jpg' %}" alt="AMERICAN EXPRESS" class="card-radio-image">
                    {% endif %}
                </label>
            </div>
        {% endfor %}
    {% endfor %}
</div>

<style>
    /* Hacemos que el cursor cambie al pasar sobre la imagen para indicar que es clickable */
    .card-radio-label {
      cursor: pointer;
    }
  
    /* Estilo por defecto de la imagen */
    .card-radio-image {
      border: 2px solid #e9ecef;
      border-radius: 5px;
      transition: border-color 0.3s;
      width: 100px;
      height: 50px;
      padding: 5px;
    }
  
    /* Cuando el input esté seleccionado, se aplica un borde a la imagen */
    .card-radio-label input:checked + .card-radio-image {
        border-color: #5AAA08;
    }
</style>
